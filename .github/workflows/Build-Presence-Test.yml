name: Build presence test artifact

on:
  push:
    branches: [main, codex/presence-xsts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore /p:EnableWindowsTargeting=true

      - name: Run offline XboxAuthNet contract tests
        run: dotnet run --project tests/Xau.Auth.Tests/Xau.Auth.Tests.csproj -c Release

      - name: Publish test build
        run: dotnet publish XAU.sln -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true /p:PublishReadyToRun=false /p:IncludeAllContentForSelfExtract=true /p:EnableWindowsTargeting=true -o ./presence-test-publish

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: xau-presence-test-win-x64
          path: presence-test-publish
          if-no-files-found: error
